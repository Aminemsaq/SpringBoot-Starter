services:
  db:
    image: postgres:17
    container_name: starter_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-starter_db}
      POSTGRES_USER: ${DB_USER:-starter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-starter}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: starter_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-starter_db}
      DB_USER: ${DB_USER:-starter}
      DB_PASSWORD: ${DB_PASSWORD:-starter}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    image: node:24
    container_name: starter_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  frontend_node_modules:
